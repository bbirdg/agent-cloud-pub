# Nightly backup of your memory notes onto this repo's `memory-backup` branch (set up by `npx agent-cloud setup`).
# Reads the memory server with a backup-only device token (secret AGENT_MEMORY_TOKEN: export routes only) and
# commits with this repo's built-in token. Keep this repo private: the backup holds every note.
name: Nightly memory backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memory-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this folder (for the agent-cloud version it uses)
        uses: actions/checkout@v5
        with:
          path: code

      - name: Check out the memory-backup branch
        uses: actions/checkout@v5
        with:
          ref: memory-backup
          path: backup

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install agent-cloud
        working-directory: code
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull notes from the memory server
        working-directory: backup
        env:
          AGENT_MEMORY_URL: ${{ vars.AGENT_MEMORY_URL }}
          AGENT_MEMORY_TOKEN: ${{ secrets.AGENT_MEMORY_TOKEN }}
        run: node ../code/node_modules/agent-cloud/dist/src/cli.js backup pull

      - name: Commit changes
        working-directory: backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A notes projects.json
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
          else
            git commit -m "Backup $(date -u +%Y-%m-%d)"
            git push origin HEAD:memory-backup
          fi

      - name: Report the result to the memory server
        if: always()
        working-directory: backup
        env:
          AGENT_MEMORY_URL: ${{ vars.AGENT_MEMORY_URL }}
          AGENT_MEMORY_TOKEN: ${{ secrets.AGENT_MEMORY_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: node ../code/node_modules/agent-cloud/dist/src/cli.js backup report
