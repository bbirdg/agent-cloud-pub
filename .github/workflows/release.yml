# Stages a release on npm when a version tag (v1.2.3) is pushed, with provenance (a signed link from the package back
# to this workflow run). Uses npm trusted publishing (OIDC): no npm token is stored in this repo. The workflow can only
# stage: the release goes live once a maintainer approves it with their security key (`npm stage list`, then
# `npm stage approve <id>`, or on npmjs.com).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage` and trusted publishing need a newer npm than the one bundled with Node.
      - run: npm install -g npm@11.19.1
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run test:server
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm stage publish --provenance --access public
