name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/src/cli.js --help

  server:
    name: Memory server (Workers runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:server

  package:
    name: Installed from the packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm pack
      - name: Create a project from the tarball and bundle the memory server
        run: |
          set -e
          TARBALL="$PWD/$(ls agent-cloud-*.tgz)"
          cd "$RUNNER_TEMP"
          mkdir tool && cd tool && npm init -y >/dev/null && npm install --no-audit --no-fund "$TARBALL" && cd ..
          node tool/node_modules/agent-cloud/dist/src/cli.js init my-agent-cloud --no-install
          cd my-agent-cloud
          npm install --no-audit --no-fund "$TARBALL"
          node -e "const f='agent-cloud.json',s=require('./'+f);s.memory.url='https://memory.example.com';s.memory.d1.id='d1';s.memory.kv.id='kv';require('fs').writeFileSync(f,JSON.stringify(s))"
          npx agent-cloud deploy --dry-run
          mkdir -p "$RUNNER_TEMP/home/.agent-cloud" && echo '{"AGENT_MEMORY_TOKEN":"amem_ci"}' > "$RUNNER_TEMP/home/.agent-cloud/secrets.json"
          npx agent-cloud sync --apply --home "$RUNNER_TEMP/home"
          test -f "$RUNNER_TEMP/home/.claude/CLAUDE.md"
